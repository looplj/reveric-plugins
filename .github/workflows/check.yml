name: Check

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - id: detect
        run: node scripts/cli.mjs discover
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

  plugins:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/cli.mjs check "$PLUGIN"
        env:
          PLUGIN: ${{ matrix.plugin }}

  checks:
    name: checks
    if: always()
    needs: [detect, plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          test "$DETECT" = success
          test "$PLUGINS" = success || test "$PLUGINS" = skipped
        env:
          DETECT: ${{ needs.detect.result }}
          PLUGINS: ${{ needs.plugins.result }}
