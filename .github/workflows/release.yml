name: Release plugins

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      index_only:
        description: Rebuild the catalog without publishing plugins
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication and index deployment. GitHub can coalesce pending runs;
# each run reconciles current main against all published plugin input hashes.
concurrency:
  group: plugin-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Reconcile current main when this queued run starts. Do not publish
          # older code after a newer run has already published it.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish changed plugins
        id: publish
        if: inputs.index_only != true
        continue-on-error: true
        run: node scripts/cli.mjs publish --yes
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Sync catalog and packages to Cloudflare R2
        run: node scripts/cli.mjs sync-r2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report any failed plugin releases
        if: steps.publish.outcome == 'failure'
        run: exit 1
